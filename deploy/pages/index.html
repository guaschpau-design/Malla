<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tesel se ha mudado · Tesel has moved</title>
    <meta name="robots" content="noindex" />
    <script>
      // Keeps the rest of the address, so old invitation links (/{repo}/join#token) still work.
      const rest = location.pathname.replace(/^\/[^/]+\/?/, '');
      location.replace(`https://tesel.eu/app/${rest}${location.search}${location.hash}`);
    </script>
  </head>
  <body>
    <p>
      Tesel está ahora en <a href="https://tesel.eu/app/">tesel.eu/app</a> · Tesel now lives at
      <a href="https://tesel.eu/app/">tesel.eu/app</a>
    </p>
  </body>
</html>
