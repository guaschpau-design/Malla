# A Tesel command post: the same server as the VPS, replicating it (TESEL_UPSTREAM), behind
# Caddy with a certificate obtained beforehand by lego (see install.sh). Installed into
# /opt/tesel-post with its settings in /opt/tesel-post/.env.

name: tesel-post

services:
  tesel:
    image: ${TESEL_IMAGE:-ghcr.io/guaschpau-design/tesel-server:latest}
    restart: unless-stopped
    environment:
      TESEL_UPSTREAM: ${TESEL_UPSTREAM:?set TESEL_UPSTREAM in .env}
      TESEL_RETENTION_DAYS: ${TESEL_RETENTION_DAYS:-30}
    volumes:
      - tesel-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TESEL_DOMAIN: ${TESEL_DOMAIN:?set TESEL_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./maps:/srv/maps:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: [no-new-privileges:true]
    networks: [internal]
    depends_on: [tesel]

volumes:
  tesel-data:
  caddy-data:
  caddy-config:

networks:
  internal:
