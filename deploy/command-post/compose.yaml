# A Tesel command post: the same server as the VPS, replicating it (TESEL_UPSTREAM), behind
# Caddy with the certificate refresh.sh downloads from the upstream. Installed into
# /opt/tesel-post with its settings in /opt/tesel-post/.env. TESEL_IMAGE, the server image by
# digest, is written there by update.sh once its signature is verified.

name: tesel-post

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  tesel:
    image: ${TESEL_IMAGE:?run update.sh, which sets TESEL_IMAGE in .env}
    # The image's own health check asks /healthz; update.sh waits for it before keeping a new
    # version. Docker restarts the server when it exits, not when it is unhealthy.
    restart: unless-stopped
    # Every server setting written in .env reaches the server (apps/server/README.md lists them,
    # with their defaults); the rest of .env, for the installer and Caddy, the server ignores.
    env_file: .env
    environment:
      # Without it this would be a server of its own, not a post: refuse to start instead.
      TESEL_UPSTREAM: ${TESEL_UPSTREAM:?set TESEL_UPSTREAM in .env}
    volumes:
      - tesel-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 256
    logging: *logging
    networks: [internal]

  caddy:
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    restart: unless-stopped
    environment:
      TESEL_DOMAIN: ${TESEL_DOMAIN:?set TESEL_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./headers.caddy:/etc/caddy/headers.caddy:ro
      - ./maps:/srv/maps:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    # Caddy runs as root in its image; it keeps only the right to listen on ports 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 256
    logging: *logging
    networks: [internal]
    depends_on: [tesel]

volumes:
  tesel-data:
  caddy-data:
  caddy-config:

networks:
  internal:
