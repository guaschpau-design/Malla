# Teselia on a VPS: the relay server behind Caddy, which obtains and renews the HTTPS certificate.
# Installed by install.sh into /opt/teselia, with TESELIA_DOMAIN set in /opt/teselia/.env.

name: teselia

services:
  teselia:
    image: ${TESELIA_IMAGE:-ghcr.io/guaschpau-design/teselia-server:latest}
    restart: unless-stopped
    environment:
      TESELIA_RETENTION_DAYS: ${TESELIA_RETENTION_DAYS:-30}
      # Name shared by this server's command posts, announced to apps (protocol §8.3).
      TESELIA_COMMAND_POST: ${TESELIA_COMMAND_POST:-}
    volumes:
      - teselia-data:/data
    # Locked down: read-only system, no Linux capabilities, no privilege escalation. The server
    # only needs to write its database and talk to Caddy on the internal network.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TESELIA_DOMAIN: ${TESELIA_DOMAIN:?set TESELIA_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./maps:/srv/maps:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: [no-new-privileges:true]
    networks: [internal]
    depends_on: [teselia]

volumes:
  teselia-data:
  caddy-data:
  caddy-config:

networks:
  internal:
