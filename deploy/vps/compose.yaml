# Tesel on a VPS: the relay server behind Caddy, which obtains and renews the HTTPS certificate.
# Installed by install.sh into /opt/tesel, with TESEL_DOMAIN set in /opt/tesel/.env.

name: tesel

services:
  tesel:
    image: ${TESEL_IMAGE:-ghcr.io/guaschpau-design/tesel-server:latest}
    restart: unless-stopped
    environment:
      TESEL_RETENTION_DAYS: ${TESEL_RETENTION_DAYS:-30}
      # Name shared by this server's command posts, announced to apps (protocol §8.3).
      TESEL_COMMAND_POST: ${TESEL_COMMAND_POST:-}
    volumes:
      - tesel-data:/data
    # Locked down: read-only system, no Linux capabilities, no privilege escalation. The server
    # only needs to write its database and talk to Caddy on the internal network.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TESEL_DOMAIN: ${TESEL_DOMAIN:?set TESEL_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./redirects.caddy:/etc/caddy/redirects.caddy:ro
      - ./maps:/srv/maps:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: [no-new-privileges:true]
    networks: [internal]
    depends_on: [tesel]

volumes:
  tesel-data:
  caddy-data:
  caddy-config:

networks:
  internal:
