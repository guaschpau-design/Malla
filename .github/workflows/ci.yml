name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs get read access only, and each one asks for what more it needs. Actions are pinned by
# commit, since a tag can be moved; the comment says which release the commit is.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # The Node version of the server image (apps/server/Dockerfile).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tesel/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results

  # The web app moved to tesel.eu (ADR-0017). GitHub Pages now only redirects old addresses and
  # retires the old service worker (deploy/pages).
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir site
          cp deploy/pages/index.html deploy/pages/sw.js site/
          cp deploy/pages/index.html site/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The server image, with the landing page and the web app (ADR-0049). Every run builds it for
  # amd64 and starts it locked down as on the VPS: it must report healthy and serve the page and
  # the app. After a green push to main it is then published for amd64 and arm64 (for servers on
  # ARM machines), signed with cosign by this workflow's identity, and only then tagged "latest",
  # the tag servers follow, if its commit is still the newest on main. Servers run only images
  # signed so.
  image:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # A newer push to main cancels an older run still in this job; an older run that reaches it
    # after a newer one is kept from "latest" below. Pull requests have groups of their own.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tesel-server
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tesel-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image as servers do
        run: |
          docker run --detach --name tesel --publish 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            tesel-server:test
          timeout 90 sh -c \
            'until [ "$(docker inspect --format "{{.State.Health.Status}}" tesel)" = healthy ]; do sleep 2; done'
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep '<html' > /dev/null
          curl -fsS http://127.0.0.1:8080/app/ | grep '<html' > /dev/null
      - name: Server logs
        if: failure()
        run: docker logs tesel

      - if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish for amd64 and arm64
        id: publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The version servers verify with (deploy/vps/install-cosign.sh).
          cosign-release: v3.1.4
      - name: Sign, then tag as latest if still the newest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now: $GITHUB_SHA is published, and latest stays as it is."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
